[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classact"
version = "0.1.11"
description = "Studio for NVIDIA Object-Oriented Agents on Nemotron NIM"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Cobus Greyling" }]
keywords = ["agents", "nemotron", "nooa", "nvidia", "nim"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "nooa[tracing]==0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/cobusgreyling/classact"
Documentation = "https://github.com/cobusgreyling/classact/blob/main/docs/GUIDE.md"
Issues = "https://github.com/cobusgreyling/classact/issues"

[tool.setuptools]
py-modules = ["app"]
packages = ["src", "catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
